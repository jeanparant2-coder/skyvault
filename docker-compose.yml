services:
  personal-cloud-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-cloud-web
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - STORAGE_ROOT=/data/storage
      - STORAGE_CAPACITY_BYTES=21474836480
      - MAX_UPLOAD_SIZE_MB=200
    volumes:
      - cloud_storage:/data/storage
    restart: unless-stopped

volumes:
  cloud_storage:
